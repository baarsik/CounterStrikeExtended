name: Build AMXX module

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win32
            os: windows-2022
            preset: amxx-win32-release
          - platform: linux32
            os: ubuntu-24.04
            preset: amxx-linux32-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up MSVC x86
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x86

      - name: Build Win32 module
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake --preset amxx-win32-release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset amxx-win32-release --parallel

      - name: Build Linux32 module with glibc 2.17
        if: runner.os == 'Linux'
        shell: bash
        run: |
          docker run --rm --platform linux/386 \
            --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace \
            quay.io/pypa/manylinux2014_i686@sha256:7ff084c274da66ed891df826b97cd5bb1b1d36db2cc86e4f052ce47cb4b69ead \
            bash -ec '
              export PATH=/opt/python/cp311-cp311/bin:$PATH
              python -m pip install --disable-pip-version-check --no-cache-dir ninja==1.13.2
              cmake --preset amxx-linux32-release
              cmake --build --preset amxx-linux32-release --parallel 2
              # Let the host runner add source archives to the container build outputs.
              chown -R --reference=/workspace build/amxx-linux32-release
            '

      - name: Include corresponding source
        shell: bash
        env:
          PACKAGE_DIR: build/${{ matrix.preset }}/package
        run: |
          git archive --format=zip --output="$PACKAGE_DIR/cse-amxx-source.zip" HEAD -- \
            CMakeLists.txt CMakePresets.json LICENSE LICENSES cmake/AMXXModules.cmake cmake/TargetPlatform.cmake \
            cmake/ExpatDependency.cmake cmake/WebPDependency.cmake cmake/dependencies/WebP \
            cmake/targets/csextended src/amxx/csextended \
            src/external/amxx-sdk src/external/expat-source src/external/libwebp-source \
            src/common/image_codec.cpp src/common/image_codec.h \
            src/public/cse_extended_stats_protocol.h src/public/cse_server_forms.h src/public/cse_server_forms.cpp \
            src/public/cse_server_forms_image.cpp src/public/cse_server_forms_xaml.cpp \
            src/public/cse_custom_weapons.h src/public/native_module.h \
            docs/extended-stats.md docs/server-forms.md docs/images/server-forms-showcase.png
          printf 'Source commit: %s\nCorresponding source: cse-amxx-source.zip\n' \
            "$GITHUB_SHA" > "$PACKAGE_DIR/SOURCE.txt"

      - name: Upload module ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: csextended-${{ matrix.platform }}
          path: build/${{ matrix.preset }}/package/
          if-no-files-found: error
          compression-level: 9
