<!doctype html><html><head><meta charset="utf-8"><style>body{background:#000;color:#fb0;font:16px Verdana}canvas{width:500px;height:220px}</style></head><body><p>CSE local browser paint benchmark</p><canvas id="c" width="500" height="220"></canvas><script>const x=document.getElementById('c').getContext('2d');let n=0;function draw(){x.fillStyle=(n++%2)?'#20e060':'#2040e0';x.fillRect(0,0,500,220);x.fillStyle='#fff';x.fillRect(n%480,90,20,20);requestAnimationFrame(draw)}requestAnimationFrame(draw)</script></body></html>
